name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test inventory and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run standard-library tests
        run: python3 -m unittest discover -s tests

      - name: Parse workflow schema
        run: |
          python3 -m json.tool schemas/review-proposal.schema.json > /dev/null
          python3 -m json.tool schemas/translation-work-packet.v1.schema.json > /dev/null
          python3 -m json.tool schemas/canonical-entry.v1.schema.json > /dev/null
          python3 -m json.tool schemas/identifier-ledger.v1.schema.json > /dev/null
          python3 -m json.tool profiles/translation-source.v1.json > /dev/null
          python3 -m json.tool schemas/public-distribution.v1.schema.json > /dev/null
          python3 -m json.tool schemas/public-distribution.v2.schema.json > /dev/null
          python3 -m json.tool schemas/public-proposal.v1.schema.json > /dev/null
          python3 -m json.tool schemas/public-review.v1.schema.json > /dev/null
          python3 -m json.tool schemas/release-closure.v1.schema.json > /dev/null

      - name: Validate translation workflow
        run: python3 scripts/translation_workflow.py doctor --offline

      - name: Validate canonical publication content
        run: python3 scripts/validate_content.py

      - name: Validate compliance records
        run: python3 scripts/validate_compliance.py

      - name: Build and validate public distribution contract
        run: |
          python3 scripts/validate_public_tree.py
          python3 scripts/validate_public_proposal.py
          python3 scripts/build_public_review.py \
            --output content/public-proposals/issue-0026.public-review.json \
            --check
          python3 scripts/validate_release_closure.py
          python3 scripts/build_public_distribution.py \
            --output .runtime/public-distribution \
            --repository-commit "${GITHUB_SHA}"
          python3 scripts/validate_public_distribution.py .runtime/public-distribution

      - name: Parse compliance schemas
        run: |
          python3 -m json.tool compliance/schemas/source-register.v1.schema.json > /dev/null
          python3 -m json.tool compliance/schemas/promotion-readiness.v1.schema.json > /dev/null
          python3 -m json.tool compliance/schemas/book-rights-matrix.v1.schema.json > /dev/null
          python3 -m json.tool compliance/rights-matrix.al-isabah.v1.json > /dev/null
