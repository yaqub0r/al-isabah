name: Publish public-working distribution

on:
  workflow_dispatch:
    inputs:
      repository_commit:
        description: Exact reviewed main commit to publish
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: al-isabah-public-distribution
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate, and publish immutable bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.repository_commit }}

      - name: Require the exact current protected main commit
        env:
          REPOSITORY_COMMIT: ${{ inputs.repository_commit }}
        run: |
          set -euo pipefail
          [[ "${REPOSITORY_COMMIT}" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${REPOSITORY_COMMIT}"
          test "$(git rev-parse origin/main)" = "${REPOSITORY_COMMIT}"

      - name: Build deterministic distribution
        env:
          REPOSITORY_COMMIT: ${{ inputs.repository_commit }}
        run: |
          set -euo pipefail
          archive=".runtime/al-isabah-public-distribution-${REPOSITORY_COMMIT}.zip"
          verification_archive="${archive%.zip}.verification.zip"
          python3 scripts/build_translation_governance_reference.py
          python3 -m unittest discover -s tests
          python3 scripts/validate_compliance.py
          python3 scripts/validate_content.py
          python3 scripts/validate_entry_titles.py
          python3 scripts/execution_governance.py
          python3 scripts/build_public_distribution.py \
            --output .runtime/public-distribution \
            --archive "${archive}" \
            --repository-commit "${REPOSITORY_COMMIT}"
          python3 scripts/validate_public_distribution.py .runtime/public-distribution
          python3 -c 'import sys; from pathlib import Path; from scripts.build_public_distribution import package; package(Path(".runtime/public-distribution"), Path(sys.argv[1]))' "${verification_archive}"
          cmp "${archive}" "${verification_archive}"
          archive_dir="$(dirname "${archive}")"
          archive_name="$(basename "${archive}")"
          (cd "${archive_dir}" && sha256sum "${archive_name}" > "${archive_name}.sha256")
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          echo "CHECKSUM=${archive}.sha256" >> "${GITHUB_ENV}"

      - name: Publish commit-addressed public-working pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_COMMIT: ${{ inputs.repository_commit }}
        run: |
          set -euo pipefail
          tag="public-working-${REPOSITORY_COMMIT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists as a remote tag; refusing to reuse it." >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; refusing to mutate or replace it." >&2
            exit 1
          fi
          gh release create "${tag}" "${ARCHIVE}" "${CHECKSUM}" \
            --target "${REPOSITORY_COMMIT}" \
            --title "Al-Isabah public-working distribution ${REPOSITORY_COMMIT::12}" \
            --notes "Application-neutral, complete machine-ready public-working distribution. Human review remains ongoing and canonical promotion remains blocked. Verify the archive with the attached SHA-256 checksum." \
            --prerelease
